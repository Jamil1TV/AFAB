# ═══════════════════════════════════════════════
# AFAB Backend — Base Application Configuration
# Safe-by-default: NO hardcoded production secrets
# ═══════════════════════════════════════════════

spring:
  application:
    name: afab-backend

  # ── Database ──────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:afab}
    username: ${POSTGRES_USER:afab_user}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # ── JPA / Hibernate ───────────────────────────
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  # ── Flyway ────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Mail (SMTP) ───────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

  # ── Redis ─────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── Multipart Upload Limits ───────────────────
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 15MB

# ── Server ────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# ── Custom Config ─────────────────────────────────
afab:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  auth:
    cookie:
      secure: ${AFAB_COOKIE_SECURE:true}
      same-site: ${AFAB_COOKIE_SAME_SITE:Lax}
      domain: ${AFAB_COOKIE_DOMAIN:}
      refresh-path: /api/v1/auth
      csrf-cookie-name: afab_csrf
      csrf-header-name: X-CSRF-Token
    allow-dev-otp: ${AFAB_ALLOW_DEV_OTP:false}
  security:
    trusted-proxies: ${AFAB_TRUSTED_PROXIES:}
  rate-limit:
    enabled: ${AFAB_RATE_LIMIT_ENABLED:true}
    fail-mode: ${AFAB_RATE_LIMIT_FAIL_MODE:fail_closed}
    login-per-minute: ${AFAB_RATE_LIMIT_LOGIN:10}
    register-per-minute: ${AFAB_RATE_LIMIT_REGISTER:5}
    forgot-password-per-minute: ${AFAB_RATE_LIMIT_FORGOT_PASSWORD:5}
    verify-email-per-minute: ${AFAB_RATE_LIMIT_VERIFY_EMAIL:10}
    otp-per-minute: ${AFAB_RATE_LIMIT_OTP:10}
    reset-password-per-minute: ${AFAB_RATE_LIMIT_RESET_PASSWORD:5}
    refresh-per-minute: ${AFAB_RATE_LIMIT_REFRESH:30}
  flyway:
    repair-on-migrate: ${AFAB_FLYWAY_REPAIR:false}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    from-name: ${MAIL_FROM_NAME:AFAB}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${MAIL_RETRY_BACKOFF_MS:1000}
    health-check-interval-ms: ${MAIL_HEALTH_CHECK_INTERVAL_MS:1800000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:afab-receipts}
    max-file-size-bytes: ${AFAB_RECEIPT_MAX_SIZE_BYTES:10485760}
    presign-expiry-seconds: ${AFAB_RECEIPT_PRESIGN_EXPIRY_SECONDS:300}
  recurring:
    scheduler-enabled: ${AFAB_RECURRING_SCHEDULER_ENABLED:true}
    cron: ${AFAB_RECURRING_CRON:0 */15 * * * *}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    portal-configuration-id: ${STRIPE_PORTAL_CONFIGURATION_ID:bpc_1Ueknz38YkKVFSSmHl6ImMe7}
    price-plus-monthly: ${STRIPE_PRICE_PLUS_MONTHLY:}
    price-plus-yearly: ${STRIPE_PRICE_PLUS_YEARLY:}
    price-pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
    price-pro-yearly: ${STRIPE_PRICE_PRO_YEARLY:}
  ai:
    enabled: ${AFAB_AI_ENABLED:true}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${AFAB_AI_CHAT_MODEL:gemma4:e4b}
    embed-model: ${AFAB_AI_EMBED_MODEL:embeddinggemma-2:270m}
    embedding-dimension: 768
    num-ctx: ${AFAB_AI_NUM_CTX:4096}
    max-output-tokens: ${AFAB_AI_MAX_OUTPUT_TOKENS:1024}
    max-tool-calls-per-turn: ${AFAB_AI_MAX_TOOL_CALLS:4}
    max-concurrent-requests: ${AFAB_AI_MAX_CONCURRENT:1}
    timeout-seconds: ${AFAB_AI_TIMEOUT_SECONDS:90}
    thinking-enabled: ${AFAB_AI_THINKING_ENABLED:false}
    prompt-version: copilot-v1.0

# ── OpenAPI / Swagger ─────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── Logging ───────────────────────────────────────
logging:
  level:
    com.afab: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
