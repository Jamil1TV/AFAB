# Base (Light) launcher icon configuration.
# Android `-night` resources (drawable-night-* / mipmap-night-* / values-night/colors.xml)
# and iOS 18 `luminosity: dark` AppIcon use `assets/branding/app_icon_dark.png` on `#020817`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_light.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_light.png"
  adaptive_icon_foreground_inset: 14
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  min_sdk_android: 21
