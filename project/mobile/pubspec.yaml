name: afab_mobile
description: "AFAB — AI Finance Assistant for Business (Mobile & Tablet)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.4
  decimal: ^3.2.6
  intl: ^0.20.2
  fl_chart: ^1.3.1
  lucide_icons_flutter: ^3.1.25
  google_fonts: ^8.2.1
  connectivity_plus: ^6.1.0
  shimmer: ^3.0.0
  uuid: ^4.5.3
  cached_network_image: ^4.0.3
  image_picker: ^1.2.4
  file_picker: ^13.4.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  http_parser: ^4.1.2
  flutter_dotenv: ^6.0.2
  url_launcher: ^6.3.3
  pdf: ^3.13.1
  speech_to_text: ^7.4.0
  local_auth: ^3.0.2
  qr: ^3.0.3
  image: ^4.13.1
  excel_community: ^2.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/branding/
    - assets/fonts/
    - .env
